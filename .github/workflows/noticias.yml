name: Atualizar noticias da Radio Guaicui

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Buscar e misturar noticias
        shell: bash
        run: |
          python - <<'PY'
          import json
          import random
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          FEEDS = [
              {
                  "categoria": "AGÊNCIA BRASIL",
                  "url": "https://agenciabrasil.ebc.com.br/rss/ultimasnoticias/feed.xml"
              },
              {
                  "categoria": "CNN BRASIL",
                  "url": "https://www.cnnbrasil.com.br/feed/"
              },
              {
                  "categoria": "ESPORTES",
                  "url": "https://www.mg.superesportes.com.br/rss/capa_rss/"
              },
              {
                  "categoria": "MINAS GERAIS",
                  "url": "https://news.google.com/rss/search?q=Minas%20Gerais&hl=pt-BR&gl=BR&ceid=BR:pt-419"
              }
          ]

          def baixar(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 Radio Guaicui Bot"
                  }
              )

              with urllib.request.urlopen(req, timeout=30) as resposta:
                  return resposta.read()

          def extrair(xml, categoria):
              noticias = []

              try:
                  root = ET.fromstring(xml)
              except Exception as erro:
                  print(f"Erro lendo {categoria}: {erro}")
                  return noticias

              for item in root.findall(".//item"):
                  titulo = item.findtext("title", "").strip()
                  link = item.findtext("link", "").strip()

                  if titulo and link:
                      noticias.append({
                          "title": f"[{categoria}] {titulo}",
                          "link": link
                      })

              return noticias

          todas = []

          for feed in FEEDS:
              print(f"Buscando: {feed['categoria']}")

              try:
                  xml = baixar(feed["url"])
                  noticias = extrair(xml, feed["categoria"])

                  print(f"  Encontradas: {len(noticias)}")

                  # Pega até 10 manchetes de cada fonte
                  todas.extend(noticias[:10])

              except Exception as erro:
                  print(f"  Falha em {feed['categoria']}: {erro}")

          # Remove manchetes repetidas
          unicas = []
          links = set()

          for noticia in todas:
              if noticia["link"] not in links:
                  links.add(noticia["link"])
                  unicas.append(noticia)

          # Mistura as fontes
          random.shuffle(unicas)

          # Limita o tamanho do arquivo
          unicas = unicas[:30]

          dados = {
              "source": "Radio Guaicui - Noticias",
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "items": unicas
          }

          with open("noticias.json", "w", encoding="utf-8") as arquivo:
              json.dump(
                  dados,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"Total de noticias: {len(unicas)}")
          PY

      - name: Publicar
        run: |
          git config user.name "Radio Guaicui Bot"
          git config user.email "actions@users.noreply.github.com"
          git add noticias.json
          git diff --cached --quiet || git commit -m "Atualiza noticias"
          git push
