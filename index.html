<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rádio Guaicuí - Ticker</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.bar{position:fixed;left:0;right:0;bottom:0;height:70px;background:#080808;border:2px solid #e40000;border-radius:10px;display:flex;overflow:hidden;box-shadow:0 0 18px #e4000066}
.tag{width:245px;flex:none;background:linear-gradient(135deg,#730000,#e40000,#730000);color:#fff;font-weight:900;font-size:22px;display:flex;align-items:center;gap:10px;padding:0 18px;clip-path:polygon(0 0,90% 0,100% 50%,90% 100%,0 100%);z-index:2}
.tag b{font-size:30px;background:#fff;color:#e40000;border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
.view{flex:1;overflow:hidden;display:flex;align-items:center}
.track{display:flex;align-items:center;white-space:nowrap}
.item{font-size:23px;font-weight:700;color:#fff;padding:0 25px}.item i{color:#f22;font-style:normal;font-size:28px;margin-left:25px}
.msg{color:#fff;font-size:20px;font-weight:700;padding-left:20px}
</style>
</head>
<body>
<div class="bar">
  <div class="tag"><b>!</b><span>ÚLTIMAS<br>NOTÍCIAS</span></div>
  <div class="view"><div id="track" class="track"><div class="msg">Carregando notícias...</div></div></div>
</div>
<script>
/*
 RÁDIO GUAICUÍ - TICKER
 Fonte principal: feed RSS da Repórter Brasil.
 O conteúdo é atualizado automaticamente a cada 5 minutos.
*/
const FEED="https://reporterbrasil.org.br/categorias/noticias/feed/";
const API="https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(FEED);
const FALLBACK=[
 "Rádio Guaicuí — A mais gostosa de ouvir!",
 "Acompanhe a programação da Rádio Guaicuí",
 "Últimas notícias em atualização"
];
const track=document.getElementById("track");

function esc(s){return String(s).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));}

function draw(titles){
 if(!titles.length) titles=FALLBACK;
 const one=titles.map(t=>'<div class="item">'+esc(t)+' <i>●</i></div>').join("");
 track.innerHTML=one+one;
 requestAnimationFrame(()=>{
   const distance=track.scrollWidth/2;
   const seconds=Math.max(30,Math.min(70,distance/70));
   const st=document.createElement("style");
   st.textContent="@keyframes roll{from{transform:translateX(0)}to{transform:translateX(-"+distance+"px)}}#track{animation:roll "+seconds+"s linear infinite}";
   document.head.appendChild(st);
 });
}

async function update(){
 try{
   const r=await fetch(API,{cache:"no-store"});
   if(!r.ok) throw Error("HTTP "+r.status);
   const j=await r.json();
   if(j.status!=="ok" || !Array.isArray(j.items)) throw Error("feed");
   const titles=j.items.map(x=>(x.title||"").trim()).filter(Boolean).slice(0,18);
   draw(titles);
 }catch(e){
   console.warn("Ticker:",e);
   draw(FALLBACK);
 }
}
draw(FALLBACK);
update();
setInterval(update,300000);
</script>
</body>
</html>
