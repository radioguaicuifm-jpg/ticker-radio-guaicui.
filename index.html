<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rádio Guaicuí - Notícias</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{font-family:Arial,Helvetica,sans-serif}
.bar{position:fixed;left:0;right:0;bottom:0;height:74px;background:#050505;border-top:3px solid #e40000;border-bottom:2px solid #650000;display:flex;overflow:hidden;box-shadow:0 -3px 20px #e4000044}.tag{width:275px;flex:none;background:linear-gradient(100deg,#7a0000,#e40000 52%,#a40000);color:#fff;font-weight:900;font-size:21px;letter-spacing:.3px;display:flex;align-items:center;gap:12px;padding:0 20px;position:relative;z-index:2;box-shadow:7px 0 18px #000b}.tag:after{content:"";position:absolute;right:-18px;top:0;border-top:37px solid transparent;border-bottom:37px solid transparent;border-left:18px solid #a40000}.tag b{font-size:27px;background:#fff;color:#e40000;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;box-shadow:0 0 10px #fff5}.tag span{line-height:1.05}.view{flex:1;overflow:hidden;display:flex;align-items:center;background:linear-gradient(90deg,#090909,#121212 50%,#090909)}.track{display:flex;align-items:center;white-space:nowrap}.item{font-size:22px;font-weight:700;color:#fff;padding:0 34px;text-shadow:0 1px 3px #000;letter-spacing:.1px}.item i{color:#e40000;font-style:normal;font-size:16px;margin-left:30px;text-shadow:0 0 8px #e40000}.msg{color:#fff;font-size:20px;font-weight:700;padding-left:24px}</style></head><body><div class="bar"><div class="tag"><b>!</b><span>ÚLTIMAS<br>NOTÍCIAS</span></div><div class="view"><div id="track" class="track"><div class="msg">Carregando notícias...</div></div></div></div>
<script>
const FALLBACK=["Rádio Guaicuí — A mais gostosa de ouvir!","Acompanhe a programação da Rádio Guaicuí","Últimas notícias em atualização"],track=document.getElementById("track");
function esc(s){return String(s).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
function draw(a){if(!a.length)a=FALLBACK;let one=a.map(t=>'<div class="item">'+esc(t)+' <i>●</i></div>').join("");track.innerHTML=one+one;requestAnimationFrame(()=>{let d=track.scrollWidth/2,s=Math.max(80,Math.min(180,d/80)),st=document.createElement("style");st.textContent="@keyframes roll{from{transform:translateX(0)}to{transform:translateX(-"+d+"px)}}#track{animation:roll "+s+"s linear infinite}";document.head.appendChild(st)})}
async function update(){try{let r=await fetch("noticias.json?x="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(r.status);let j=await r.json();draw((j.items||[]).map(x=>x.title).filter(Boolean).slice(0,18))}catch(e){draw(FALLBACK)}}
draw(FALLBACK);update();setInterval(update,300000);
</script></body></html>
